<!doctype html>
<html class="no-js" lang="en">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>WikiHub: A GitHub Repository Search Tool</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
<div class="container mb-4">
  <div class="row text-center">
    <div class="col">
      <h1 class=" fw-bold">WikiHub: A GitHub Repository Finder</h1>
      <p class="lead text-muted">Search for GitHub users and explore their public repositories in real time.</p>
    </div>
  </div>
  <div class="row">
    <div class="col col-md-8">
      <h3>Input Username</h3>
      <div class="input-group">
        <input type="text" id="username-input" class="form-control" placeholder="Enter GitHub Username (e.g., octocat)">
        <button class="btn btn-primary" type="button" id="search-btn">
          Find Repositories
        </button>
      </div>
    </div>
  </div>
</div>

<div class="container">
  <div class="table-responsive">
    <table class="table table-striped table-hover align-middle">
      <thead class="table-dark">
      <tr>
        <th scope="col">Name of Repository</th>
        <th scope="col">Description</th>
        <th scope="col">Stars</th>
        <th scope="col">Link</th>
      </tr>
      </thead>
      <tbody id="repos-table-body">
      <tr>
        <td colspan="4" class="text-center text-muted">Enter a username to look their repository.</td>
      </tr>
      </tbody>
    </table>
  </div>
</div>

<!-- Cargar jQuery -->
<script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>

<!-- Cargar JavaScript de Bootstrap -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Lógica en JavaScript/jQuery -->
<script src="js/app.js"></script>

</body>



</html>
